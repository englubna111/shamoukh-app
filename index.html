<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCswfAOwpDSKvqgu59oh_am8CLqYdFUElM",
    authDomain: "loubna-33283.firebaseapp.com",
    projectId: "loubna-33283",
    storageBucket: "loubna-33283.firebasestorage.app",
    messagingSenderId: "55592232522",
    appId: "1:55592232522:web:e231fbb781a7274bb3a8b3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===== Firebase helpers =====
  window.fbSaveRequest = async function(req){
    try{
      const data = JSON.parse(JSON.stringify(req));
      // حذف base64 الكبيرة من Firestore - نخزنها مضغوطة
      await setDoc(doc(db,'requests', req.id), data);
    }catch(e){ console.error('Firebase save error:', e); }
  };

  window.fbSavePending = async function(rows){
    try{
      await setDoc(doc(db,'meta','pendingRows'), {rows: JSON.stringify(rows)});
    }catch(e){ console.error('Firebase pending error:', e); }
  };

  // مسح كل المعاملات (تجريبية) من قاعدة البيانات
  window.fbResetAll = async function(){
    const snap = await getDocs(collection(db,'requests'));
    let n = 0;
    for(const d of snap.docs){ await deleteDoc(doc(db,'requests', d.id)); n++; }
    await setDoc(doc(db,'meta','pendingRows'), {rows: '[]'});
    return n;
  };

  // حذف معاملة واحدة من قاعدة البيانات
  window.fbDeleteRequest = async function(id){
    await deleteDoc(doc(db,'requests', id));
  };

  // Listen for real-time updates
  const q = query(collection(db,'requests'));
  onSnapshot(q, (snapshot)=>{
    window._fbRequests = [];
    snapshot.forEach(d=>{ window._fbRequests.push(d.data()); });
    if(window.onFbUpdate) window.onFbUpdate(window._fbRequests);
  });

  onSnapshot(doc(db,'meta','pendingRows'), (d)=>{
    if(d.exists()){ 
      try{ window._fbPending = JSON.parse(d.data().rows||'[]'); }catch(e){}
      if(window.onFbPendingUpdate) window.onFbPendingUpdate(window._fbPending);
    }
  });

  window.fbReady = true;
  console.log('Firebase connected ✅');
</script>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2230; --panel2:#212c3d; --border:#2c3a4f;
    --txt:#e6edf3; --muted:#8b9bb4; --accent:#3b9eff; --green:#2ecc71;
    --red:#e74c3c; --orange:#f39c12; --purple:#9b59b6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);}
  header{background:var(--panel);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:18px;color:var(--accent);}
  nav{display:flex;gap:8px;}
  nav button{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  main{padding:16px;}
  .section{display:none;}
  .section.active{display:block;}

  /* ===== Excel Section ===== */
  .upload-box{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;margin-bottom:16px;background:var(--panel);}
  .upload-box input{margin-top:10px;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;}
  th{background:var(--panel2);color:var(--accent);}
  tr:hover{background:var(--panel2);}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:14px;}
  .btn:hover{opacity:.85;}
  .btn.green{background:var(--green);}
  .btn.red{background:var(--red);}
  .btn.orange{background:var(--orange);}
  .btn.gray{background:#566075;}
  .btn:disabled{background:#3a4456;cursor:not-allowed;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}

  /* ===== Dashboard ===== */
  .board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;}
  .col{min-width:230px;max-width:260px;width:230px;background:var(--panel);border-radius:8px;padding:8px;flex-shrink:0;}
  .col h3{font-size:13px;margin:4px 6px 10px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .col h3 span{color:var(--muted);font-weight:normal;}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:12px;word-break:break-word;overflow:hidden;}
  .card:hover{border-color:var(--accent);}
  .card b{display:block;font-size:13px;margin-bottom:4px;}
  .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;margin-top:4px;}
  .badge.water{background:#1f5f8b;color:#cfe8ff;}
  .badge.sewage{background:#5f1f1f;color:#ffd6d6;}
  .badge.rework{background:var(--red);color:#fff;}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.active{display:flex;}
  .modal{background:var(--panel);border-radius:10px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;border:1px solid var(--border);}
  .modal h2{margin:0 0 4px;color:var(--accent);font-size:18px;}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted);}
  textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--txt);padding:8px;border-radius:6px;font-size:13px;font-family:inherit;}
  textarea{min-height:60px;resize:vertical;}
  .checklist-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);padding:8px 10px;border-radius:6px;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .checklist-item label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:0;}
  .checklist-item input[type=checkbox]{width:18px;height:18px;}
  .photo-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .photo-row img{width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .pdfbox{width:60px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:4px;font-size:11px;font-weight:bold;color:var(--red);cursor:pointer;line-height:1.2;}
  .team-box{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--panel2);}
  .team-box h4{margin:0 0 8px;font-size:13px;color:var(--accent);}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .close-x{position:absolute;left:16px;top:14px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .modal{position:relative;}
  .history{font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:14px;padding-top:10px;max-height:120px;overflow-y:auto;}
  .history div{margin-bottom:4px;}
  .info-row{font-size:12px;color:var(--muted);margin-bottom:2px;}
  .prev-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:14px;}
  .prev-box h4{margin:0 0 8px;font-size:13px;color:var(--green);}
  .filebtn{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
  .filebtn input{display:none;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px;}
</style>
</head>

<script>
const STAGES = {
  1:{name:'مدير المشروع (مراجعة/إعادة)', color:'#566075'},
  2:{name:'المساحة', color:'#3b9eff'},
  3:{name:'المكتب الفني - مراجعة أولى', color:'#f39c12'},
  4:{name:'المكتب الفني - تصاريح بلدي', color:'#f39c12'},
  5:{name:'تصاريح صادرة', color:'#e67e22'},
  6:{name:'الأمن والسلامة', color:'#9b59b6'},
  7:{name:'مهندس الموقع - التنفيذ', color:'#2ecc71'},
  8:{name:'المكتب الفني - مراجعة نهائية', color:'#f39c12'},
  9:{name:'منصة بلدي - إخلاء', color:'#3b9eff'},
  10:{name:'مغلق ✅ (إغلاق مالي)', color:'#1abc9c'}
};
const TEAMS = ['فرقة الحفر','فرقة السباكة','فرقة WFM','فرقة الدفان','فرقة MC1 (الأسمنت)','فرقة الأسفلت','فرقة الأرصفة'];

let requests = [];
let pendingRows = [];

// ---------- storage helpers (Firebase) ----------
async function loadAll(){
  // Firebase يحدّث البيانات تلقائياً عبر onSnapshot
  if(window._fbRequests) requests = window._fbRequests;
  if(window._fbPending) pendingRows = window._fbPending;
}
async function saveRequests(){
  // حفظ كل طلب مستقل في Firebase
  for(const req of requests){
    await window.fbSaveRequest(req);
  }
}
async function savePending(){
  await window.fbSavePending(pendingRows);
}

// Firebase real-time callbacks
window.onFbUpdate = function(fbReqs){
  requests = fbReqs;
  renderBoard();
};
window.onFbPendingUpdate = function(fbPending){
  pendingRows = fbPending;
  renderExcelTable();
};

// ---------- nav ----------
let excelUnlocked = false;
document.querySelectorAll('.navbtn').forEach(b=>{
  b.onclick=()=>{
    // قسم رفع الإكسل: مدير المشروع فقط
    if(b.dataset.sec === 'excel' && !excelUnlocked){
      const pass = prompt('🔐 رفع الملفات لمدير المشروع فقط.\nأدخل كلمة مرور المدير:');
      if(pass === null) return;
      if(pass !== 'PM@1234'){ alert('❌ كلمة المرور غير صحيحة. الرفع غير مسموح.'); return; }
      excelUnlocked = true;
    }
    document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.sec).classList.add('active');
  };
});

// ---------- بحث بـ CCB NO# ----------
function openSearch(){
  document.getElementById('searchOverlay').classList.add('active');
  document.getElementById('ccbSearchInput').value = '';
  document.getElementById('ccbSearchResults').innerHTML = '';
  setTimeout(()=>document.getElementById('ccbSearchInput').focus(), 50);
}
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('active'); }

function runCcbSearch(){
  const q = document.getElementById('ccbSearchInput').value.trim().toLowerCase();
  const box = document.getElementById('ccbSearchResults');
  if(!q){ box.innerHTML=''; return; }
  const hits = requests.filter(r=> String(r.data.ccb||'').toLowerCase().includes(q));
  if(hits.length===0){
    box.innerHTML = '<div class="empty" style="padding:10px;color:var(--muted);">لا توجد معاملة بهذا الرقم</div>';
    return;
  }
  box.innerHTML = hits.map(r=>{
    const st = STAGES[r.stage];
    return `<div class="card" style="cursor:pointer;" onclick="goToCard('${r.id}')">
      <b>${r.data.customerName||'بدون اسم'}</b>
      CCB: ${r.data.ccb||'-'} &nbsp;|&nbsp; رقم الطلب: ${r.data.requestNo||'-'}<br>
      المنطقة: ${r.data.region||'-'}<br>
      <span class="badge" style="background:${st.color};color:#fff;margin-top:6px;">المرحلة ${r.stage} - ${st.name}</span>
    </div>`;
  }).join('');
}

function goToCard(id){
  closeSearch();

// ---------- نسخة احتياطية (تنزيل Excel) ----------
function downloadBackup(){
  try{
    if(!requests || requests.length===0){ alert('لا توجد معاملات للنسخ الاحتياطي.'); return; }
    const rows = [['اسم العميل','رقم الطلب','CCB NO#','المنطقة','نوع الخدمة','رقم الحساب','رقم العداد','التاريخ','المرحلة الحالية']];
    requests.forEach(r=>{
      const d = r.data || {};
      const st = STAGES[r.stage] ? (r.stage + ' - ' + STAGES[r.stage].name) : (r.stage||'');
      rows.push([d.customerName||'', d.requestNo||'', d.ccb||'', d.region||'', d.desc||'', d.accountNo||'', d.meterSize||'', d.date||'', st]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المعاملات');
    const today = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'نسخة_احتياطية_شموخ_' + today + '.xlsx');
  }catch(e){ alert('تعذّر إنشاء النسخة الاحتياطية: ' + e.message); }
}

// ---------- مسح كل المعاملات (مدير المشروع فقط) ----------
async function resetAllRequests(){
  const pass = prompt('🔐 هذا الإجراء يمسح كل المعاملات نهائياً.\nأدخل كلمة مرور مدير المشروع للتأكيد:');
  if(pass === null) return;
  if(pass !== 'PM@1234'){ alert('❌ كلمة المرور غير صحيحة'); return; }
  if(!confirm('⚠️ متأكد؟ سيتم حذف جميع المعاملات من كل الأجهزة ولا يمكن التراجع.')) return;

  if(typeof window.fbResetAll !== 'function'){
    alert('❌ لم يكتمل الاتصال بقاعدة البيانات. أعد تحميل الصفحة وحاول مرة أخرى.');
    return;
  }
  const btn = event && event.target ? event.target : null;
  const oldTxt = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري المسح...'; }
  try{
    const n = await window.fbResetAll();
    requests = []; pendingRows = [];
    window._fbRequests = []; window._fbPending = [];
    renderBoard(); renderExcelTable();
    alert('✅ تم مسح '+n+' معاملة. التطبيق الآن فاضي وجاهز للبدء.');
  }catch(e){
    const msg = (e && (e.code||e.message)) || e;
    if(String(msg).includes('permission')){
      alert('❌ قاعدة البيانات تمنع الحذف.\nلازم تعدّل قواعد Firestore للسماح بالحذف. خبّرني أعطيك القاعدة الصحيحة.');
    } else {
      alert('❌ صار خطأ أثناء المسح: ' + msg);
    }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = oldTxt; }
  }
}


// ---------- excel ----------
document.getElementById('excelInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  // تحقق من نوع الملف: لازم إكسل فقط
  const name = (file.name||'').toLowerCase();
  if(!(name.endsWith('.xlsx') || name.endsWith('.xls'))){
    alert('❌ الملف المرفوع ليس ملف إكسل.\nالمسموح فقط: .xlsx أو .xls\nتأكد إنك تختار ملف المياه الوطنية وليس صورة.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(evt){
    let rows;
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    }catch(err){
      alert('❌ تعذّر قراءة الملف كإكسل. تأكد إن الملف سليم وأنه ملف إكسل فعلاً.');
      e.target.value = '';
      return;
    }
    // كشف الملفات الخربانة (صورة/ملف تالف): محتوى غير صالح
    const looksCorrupt = (s)=>{
      s = String(s);
      if(s.indexOf('\uFFFD') !== -1) return true; // رمز محرف تالف
      let bad = 0;
      for(const ch of s){ const c = ch.charCodeAt(0); if(c < 32 && c !== 9 && c !== 10 && c !== 13) bad++; }
      return bad > 0;
    };
    let corruptCount = 0, validCount = 0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i]; if(!r || !r[1]) continue;
      if(looksCorrupt(r[1]) || looksCorrupt(r[3])) corruptCount++; else validCount++;
    }
    if(validCount === 0 || corruptCount > validCount){
      alert('❌ محتوى الملف غير صالح (يبدو أنه صورة أو ملف تالف).\nلم يتم استيراد أي بيانات. ارفع ملف الإكسل الصحيح.');
      e.target.value = '';
      return;
    }
    // بناء الصفوف (مع تجاهل الصفوف الخربانة إن وُجدت)
    pendingRows = [];
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      if(!r || !r[1]) continue;
      if(looksCorrupt(r[1]) || looksCorrupt(r[3])) continue;
      pendingRows.push({
        accountNo: r[0]||'', requestNo: r[1]||'', hesrNo: r[2]||'', ccb: r[4]||'',
        customerName: r[3]||'', region: r[5]||'', plotNo: r[6]||'', date: r[7]||'',
        meterSize: r[8]||'', lat: r[9]||'', lng: r[10]||'', desc: r[11]||'',
        selected:true
      });
    }
    e.target.value = '';
    savePending();
    renderExcelTable();
  };
  reader.readAsArrayBuffer(file);
});

function renderExcelTable(){
  const wrap = document.getElementById('excelTableWrap');
  if(pendingRows.length===0){ wrap.innerHTML=''; return; }
  let html = `<div class="toolbar">
    <div>عدد الطلبات: ${pendingRows.length} — حدد الطلبات المعتمدة ثم رحّلها إلى المساحة</div>
    <button class="btn green" onclick="sendSelected()">ترحيل المحدد إلى المساحة ➜</button>
  </div>
  <table><tr><th><input type="checkbox" id="selAll" ${pendingRows.every(r=>r.selected)?'checked':''} onchange="toggleAll(this)"></th>
  <th>اسم العميل</th><th>رقم الطلب</th><th>نوع الخدمة</th><th>المنطقة</th><th>قطر العداد</th><th>التاريخ</th></tr>`;
  pendingRows.forEach((r,i)=>{
    html += `<tr><td><input type="checkbox" ${r.selected?'checked':''} onchange="pendingRows[${i}].selected=this.checked"></td>
    <td>${r.customerName}</td><td>${r.requestNo}</td><td>${r.desc}</td><td>${r.region}</td><td>${r.meterSize}</td><td>${formatDate(r.date)}</td></tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}
function toggleAll(cb){ pendingRows.forEach(r=>r.selected=cb.checked); renderExcelTable(); }
function formatDate(d){
  if(typeof d === 'number'){ const dt = XLSX.SSF.parse_date_code(d); return `${dt.d}/${dt.m}/${dt.y}`; }
  return d;
}

function sendSelected(){
  const sel = pendingRows.filter(r=>r.selected);
  if(sel.length===0){ alert('لم تحدد أي طلب'); return; }
  sel.forEach(r=>{
    requests.push({
      id: 'REQ-'+Date.now()+'-'+Math.floor(Math.random()*1000),
      data: r,
      stage: 2,
      rework: null,
      stageData: {},
      history: [{ts:Date.now(), text:`استلام الطلب وترحيله إلى المساحة (المنطقة: ${r.region})`}]
    });
  });
  pendingRows = pendingRows.filter(r=>!r.selected);
  saveRequests(); savePending();
  renderExcelTable(); renderBoard();
  document.querySelector('[data-sec="dash"]').click();
}

// ---------- board ----------
function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  Object.keys(STAGES).forEach(stageNum=>{
    stageNum = parseInt(stageNum);
    const items = requests.filter(r=>r.stage===stageNum);
    const col = document.createElement('div');
    col.className='col';
    col.innerHTML = `<h3 style="border-bottom-color:${STAGES[stageNum].color}">${stageNum}. ${STAGES[stageNum].name} <span>(${items.length})</span></h3>`;
    if(items.length===0){
      col.innerHTML += '<div class="empty" style="padding:10px;font-size:11px;">لا توجد طلبات</div>';
    }
    items.forEach(req=>{
      try{
        const d = req.data || {};
        const card = document.createElement('div');
        card.className='card';
        const desc = d.desc || '';
        const isSewage = desc.includes('صرف');
        let badges = desc ? `<span class="badge ${isSewage?'sewage':'water'}">${desc}</span>` : '';
        if(req.rework) badges += ` <span class="badge rework">إعادة معالجة - ${req.rework.team}</span>`;
        card.innerHTML = `<b>${d.customerName||'بدون اسم'}</b>
          رقم الطلب: ${d.requestNo||'-'}<br>المنطقة: ${d.region||'-'}<br>${badges}`;
        card.onclick = ()=> openCard(req.id);
        col.appendChild(card);
      }catch(e){ console.error('skip bad request', e); }
    });
    board.appendChild(col);
  });
}

// ---------- modal helpers ----------
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
function addHistory(req, text){ req.history.push({ts:Date.now(), text}); }
function fmtTs(ts){ const d=new Date(ts); return d.toLocaleString('ar-SA'); }

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      let w = img.width, h = img.height;
      if(w>maxW){ h = h*(maxW/w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function photoUploadHTML(id){
  return `<div class="photo-row" id="photos_${id}"></div>
  <label class="filebtn">📎 رفع صور / PDF<input type="file" accept="image/*,application/pdf" multiple onchange="handlePhotos(this,'${id}')"></label>`;
}
function isPdf(src){ return typeof src==='string' && src.indexOf('data:application/pdf')===0; }
function mediaTile(src){
  if(isPdf(src)) return `<div class="pdfbox" onclick="showImg('${src}')">📄<br>PDF</div>`;
  return `<img src="${src}" onclick="showImg('${src}')">`;
}
function renderPhotos(id, arr){
  const c = document.getElementById('photos_'+id);
  if(!c) return;
  c.innerHTML = (arr||[]).map((src,i)=>
    `<div style="position:relative;display:inline-block;">
      ${mediaTile(src)}
      <button onclick="event.stopPropagation();deletePhoto('${id}',${i})" title="حذف" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;padding:0;">×</button>
    </div>`).join('');
}
function deletePhoto(id, idx){
  const req = currentReq();
  const arr = getPhotoArray(req, id);
  arr.splice(idx,1);
  saveRequests();
  if(req.stage===5){ renderModal(); } else { renderPhotos(id, arr); }
}
window.handlePhotos = function(input, id){
  const req = currentReq();
  const target = getPhotoArray(req, id);
  Array.from(input.files).forEach(f=>{
    if(f.type === 'application/pdf'){
      const reader = new FileReader();
      reader.onload = function(e){
        target.push(e.target.result);
        saveRequests();
        renderPhotos(id, target);
      };
      reader.readAsDataURL(f);
    } else {
      resizeImage(f, dataUrl=>{
        target.push(dataUrl);
        saveRequests();
        renderPhotos(id, target);
      });
    }
  });
};
function getPhotoArray(req, id){
  const sd = req.stageData;
  if(id==='s2'){ sd.s2 = sd.s2||{}; sd.s2.photos = sd.s2.photos||[]; return sd.s2.photos; }
  if(id==='s4'){ sd.s4 = sd.s4||{}; sd.s4.photos = sd.s4.photos||[]; return sd.s4.photos; }
  if(id==='s8'){ sd.s8 = sd.s8||{}; sd.s8.photos = sd.s8.photos||[]; return sd.s8.photos; }
  if(id.startsWith('safety_')){ const k=id.slice(7); sd.s5=sd.s5||{}; sd.s5.items=sd.s5.items||{}; sd.s5.items[k]=sd.s5.items[k]||{}; sd.s5.items[k].photos=sd.s5.items[k].photos||[]; return sd.s5.items[k].photos; }
  if(id.startsWith('team_')){ const k=id.slice(5); sd.s6=sd.s6||{}; sd.s6.teams=sd.s6.teams||{}; sd.s6.teams[k]=sd.s6.teams[k]||{}; sd.s6.teams[k].photos=sd.s6.teams[k].photos||[]; return sd.s6.teams[k].photos; }
  if(id.startsWith('dafanLayer_')){ const k=id.split('_')[1]; sd.s6=sd.s6||{}; sd.s6.dafanLayers=sd.s6.dafanLayers||{}; sd.s6.dafanLayers[k]=sd.s6.dafanLayers[k]||[]; return sd.s6.dafanLayers[k]; }
  return [];
}

let openId = null;
function currentReq(){ return requests.find(r=>r.id===openId); }

function openCard(id){
  openId = id;
  const req = requests.find(r=>r.id===id);
  if(!req) return;
  checkStageAuth(req.stage, ()=>{
    renderModal();
    document.getElementById('overlay').classList.add('active');
  });
}

function renderModal(){
  const req = currentReq();
  const m = document.getElementById('modalContent');
  const d = req.data;
  let body = `<button class="close-x" onclick="closeModal()">×</button>
  <h2>${d.customerName}</h2>
  <div class="sub">رقم الطلب: ${d.requestNo} | رقم الحساب: ${d.accountNo} | المنطقة: ${d.region} | قطر العداد: ${d.meterSize}</div>
  <div class="info-row">نوع الخدمة: <b>${d.desc}</b></div>
  <div class="info-row">الإحداثيات: ${d.lat}, ${d.lng} — <a href="${(req.stageData.s4&&req.stageData.s4.link)||('https://www.google.com/maps?q='+d.lat+','+d.lng)}" target="_blank" rel="noopener" style="color:var(--accent)">🗺️ فتح في خرائط Google</a></div>`;
  if(req.stage>4 && req.stageData.s4 && req.stageData.s4.photos && req.stageData.s4.photos.length){
    body += `<div class="info-row"><b>صورة تصريح بلدي:</b></div>${imgs(req.stageData.s4.photos)}`;
  }
  if(req.rework){
    body += `<div class="info-row" style="color:#ff6b6b;">⚠️ معالجة خطأ مُحالة من المرحلة ${req.rework.fromStage} - الفرقة: <b>${req.rework.team}</b></div>`;
  }
  body += `<div class="info-row" style="margin-bottom:12px;">المرحلة الحالية: <b style="color:${STAGES[req.stage].color}">${req.stage}. ${STAGES[req.stage].name}</b></div>`;

  body += prevSummary(req);

  body += stageForm(req);

  // أزرار الحذف والأرشفة
  if(req.stage === 10){
    body += `<div class="actions" style="margin-top:8px;">
      <button class="btn gray" onclick="archiveRequest('${req.id}')" style="background:#566075;">📦 أرشفة المعاملة</button>
    </div>`;
  } else {
    body += `<div class="actions" style="margin-top:8px;">
      <button class="btn red" onclick="deleteRequest('${req.id}')" style="background:#c0392b;font-size:12px;">🗑️ حذف المعاملة (مدير المشروع)</button>
    </div>`;
  }

  body += `<div class="history"><b>سجل الحركة:</b>`;
  req.history.slice().reverse().forEach(h=>{
    body += `<div>• ${h.text} <span style="opacity:.6">(${fmtTs(h.ts)})</span></div>`;
  });
  body += `</div>`;

  m.innerHTML = body;

  // re-render any saved photos
  const sd = req.stageData;
  if(req.stage===2) renderPhotos('s2', (sd.s2&&sd.s2.photos)||[]);
  if(req.stage===4) renderPhotos('s4', (sd.s4&&sd.s4.photos)||[]);
  if(req.stage===9 || req.stage===10) renderPhotos('s8', (sd.s8&&sd.s8.photos)||[]);
  if(req.stage===5) Object.keys(sd.s5&&sd.s5.items||{}).forEach(k=>renderPhotos('safety_'+k,(sd.s5.items[k]&&sd.s5.items[k].photos)||[]));
  if(req.stage===7 && req.rework){
    const k = req.rework.team;
    renderPhotos('team_'+k,(sd.s6&&sd.s6.teams&&sd.s6.teams[k]&&sd.s6.teams[k].photos)||[]);
    if(k==='فرقة الدفان') ['l1','l2','l3'].forEach(lk=>renderPhotos('dafanLayer_'+lk,(sd.s6&&sd.s6.dafanLayers&&sd.s6.dafanLayers[lk])||[]));
  } else if(req.stage===7){
    TEAMS.forEach(k=>renderPhotos('team_'+k,(sd.s6&&sd.s6.teams&&sd.s6.teams[k]&&sd.s6.teams[k].photos)||[]));
    ['l1','l2','l3'].forEach(lk=>renderPhotos('dafanLayer_'+lk,(sd.s6&&sd.s6.dafanLayers&&sd.s6.dafanLayers[lk])||[]));
  }
}

// ---------- transitions ----------
function goStage6(){
  const r = currentReq();
  const sd = r.stageData;
  const items = ['السيفتي','الشبك','التصاريح','اللوحات الإرشادية','لوحات المشروع','الإضاءة'];
  const errs=[];
  items.forEach(it=>{
    const v = sd.s5 && sd.s5.items && sd.s5.items[it];
    if(!v || !v.done) errs.push(`تأشير بند "${it}"`);
    else if(!v.photos || v.photos.length===0) errs.push(`رفع صورة لبند "${it}"`);
  });
  if(!sd.s5 || !sd.s5.notes || !sd.s5.notes.includes('تم')) errs.push('كتابة كلمة "تم" في الملاحظات العامة');
  if(errs.length){ alert('لا يمكن نقل المعاملة - يجب أولاً:\n- '+errs.join('\n- ')); return; }
  transition(7,'اكتمل تجهيز الموقع من الأمن والسلامة - الانتقال لمهندس الموقع');
}
function goStage(target, note, notesVal, photosArr){
  const errs=[];
  if(!notesVal || !notesVal.includes('تم')) errs.push('كتابة كلمة "تم" في مربع الملاحظات');
  if(photosArr!==null && (!photosArr || photosArr.length===0)) errs.push('رفع صورة/ملف واحد على الأقل');
  if(errs.length){ alert('لا يمكن نقل المعاملة - يجب أولاً:\n- '+errs.join('\n- ')); return; }
  transition(target, note);
}
function transition(newStage, note){
  const r = currentReq();
  r.stage = newStage;
  addHistory(r, note);
  saveRequests(); closeModal(); renderBoard();
}

// Google Drive Upload با OAuth
function exportToDrive(reqId){
  const req = requests.find(r=>r.id===reqId);
  if(!req){ alert('لم يتم العثور على المعاملة'); return; }
  const d = req.data;
  const sd = req.stageData;

  // بناء محتوى التقرير
  let content = `تقرير معاملة - شركة شموخ للاستدامة\n`;
  content += `=====================================\n`;
  content += `رقم الطلب: ${d.requestNo}\n`;
  content += `اسم العميل (CCB): ${d.customerName}\n`;
  content += `رقم الحساب: ${d.accountNo}\n`;
  content += `المنطقة: ${d.region}\n`;
  content += `نوع الخدمة: ${d.desc}\n`;
  content += `قطر العداد: ${d.meterSize}\n`;
  content += `الإحداثيات: ${d.lat}, ${d.lng}\n`;
  content += `=====================================\n`;
  content += `سجل الحركة:\n`;
  req.history.forEach(h=>{
    const dt = new Date(h.ts).toLocaleString('ar-SA');
    content += `• ${h.text} (${dt})\n`;
  });
  content += `\n=====================================\n`;
  if(sd.s2){ content += `المساحة:\nالقياسات: ${sd.s2.measure||''}\nالملاحظات: ${sd.s2.notes||''}\n`; }
  if(sd.s4){ content += `\nتصريح بلدي:\n${sd.s4.notes||''}\nرابط الموقع: ${sd.s4.link||''}\n`; }
  if(sd.s5 && sd.s5.notes){ content += `\nالأمن والسلامة:\n${sd.s5.notes}\n`; }
  if(sd.s8 && sd.s8.notes){ content += `\nبلدي (إخلاء):\n${sd.s8.notes}\n`; }

  const fileName = `شموخ_${d.requestNo}_${d.customerName}.txt`;

  // رفع مباشر على Google Drive عبر OAuth
  const CLIENT_ID = '563584335869-fgrhgmd47bqnekij5i8b5pr93ho849e6.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';

  // تحميل Google API
  if(!window.gapi){
    const script = document.createElement('script');
    script.src = 'https://apis.google.com/js/api.js';
    script.onload = ()=>{
      gapi.load('auth2', ()=>{
        gapi.auth2.init({client_id: CLIENT_ID}).then(()=>{
          doUpload(content, fileName);
        });
      });
    };
    document.head.appendChild(script);
  } else {
    doUpload(content, fileName);
  }
}

function doUpload(content, fileName){
  const authInstance = gapi.auth2.getAuthInstance();
  const signIn = authInstance.isSignedIn.get() 
    ? Promise.resolve() 
    : authInstance.signIn({hosted_domain: 'shomkhgp.com'});

  signIn.then(()=>{
    const token = gapi.auth2.getAuthInstance().currentUser.get().getAuthResponse().access_token;
    const blob = new Blob([content], {type:'text/plain'});
    const metadata = {name: fileName, mimeType: 'text/plain'};
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', blob);

    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token},
      body: form
    }).then(r=>r.json()).then(data=>{
      if(data.id){
        alert('✅ تم رفع الملف على Google Drive بنجاح!\nاسم الملف: ' + fileName);
      } else {
        alert('حدث خطأ: ' + JSON.stringify(data));
      }
    });
  }).catch(err=>{
    alert('تعذّر تسجيل الدخول: ' + err.error);
  });
}


// ===== نظام الصلاحيات =====
const STAGE_PASSWORDS = {
  1: 'PM@1234',
  2: 'Survey@2',
  3: 'Tech@3',
  4: 'Permit@4',
  5: 'Issued@5',
  6: 'Safety@6',
  7: 'Site@7',
  8: 'Final@8',
  9: 'Baladi@9',
  10: 'Finance@10'
};
const DELETE_PASSWORD = 'Delete@PM';
const ARCHIVE_PASSWORD = 'Archive@10';

let currentAuth = null; // المرحلة المصادق عليها حالياً

function checkStageAuth(stage, callback){
  if(currentAuth === stage || currentAuth === 'PM'){ callback(); return; }
  const pass = prompt(`🔐 أدخل كلمة مرور المرحلة ${stage}:`);
  if(!pass) return;
  if(pass === STAGE_PASSWORDS[1]){
    // مدير المشروع - صلاحية كاملة
    currentAuth = 'PM';
    callback();
  } else if(pass === STAGE_PASSWORDS[stage]){
    currentAuth = stage;
    callback();
  } else {
    alert('❌ كلمة المرور غير صحيحة');
  }
}

async function deleteRequest(reqId){
  const pass = prompt('🔐 أدخل كلمة مرور الحذف (مدير المشروع فقط):');
  if(!pass) return;
  if(pass !== DELETE_PASSWORD){ alert('❌ كلمة المرور غير صحيحة'); return; }
  if(!confirm('هل أنت متأكد من حذف هذه المعاملة نهائياً؟')) return;
  try{
    await window.fbDeleteRequest(reqId);
    requests = requests.filter(r=>r.id !== reqId);
    closeModal();
    renderBoard();
    alert('✅ تم حذف المعاملة');
  }catch(e){
    alert('❌ تعذّر الحذف: ' + e.message);
  }
}

function archiveRequest(reqId){
  const pass = prompt('🔐 أدخل كلمة مرور الأرشفة:');
  if(!pass) return;
  if(pass !== ARCHIVE_PASSWORD){ alert('❌ كلمة المرور غير صحيحة'); return; }
  const req = requests.find(r=>r.id===reqId);
  if(!req) return;
  req.archived = true;
  req.archivedAt = Date.now();
  addHistory(req, 'تم أرشفة المعاملة');
  saveRequests();
  closeModal();
  renderBoard();
  alert('✅ تم أرشفة المعاملة');
}

// ---------- init ----------
(async function(){
  // انتظر Firebase
  let tries = 0;
  while(!window.fbReady && tries < 50){ await new Promise(r=>setTimeout(r,100)); tries++; }
  await loadAll();
  renderExcelTable();
  renderBoard();
})();
</script>
